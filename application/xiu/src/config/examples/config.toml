#live server configurations
##########################
#   RTMP configurations  #
##########################
[rtmp]
enabled = true
port = 1935
gop_num = 0
# optional: max retries when no media data is received (default: 10)
# max_no_data_retries = 10
# optional: read timeout in milliseconds for server read (default: 2000)
# read_timeout_ms = 2000
[rtmp.auth]
pull_enabled = false
push_enabled = false
# simple, md5 or none
algorithm = "simple"
# pull streams from other server node.
[rtmp.pull]
enabled = false
address = "192.168.0.1"
port = 1935
# push streams to other server node.
[[rtmp.push]]
enabled = false
address = "localhost"
port = 1936
[[rtmp.push]]
enabled = false
address = "192.168.0.3"
port = 1935

[httpnotify]
enabled = true
on_publish = "http://localhost:3001/on_publish"
on_unpublish = "http://localhost:3001/on_unpuslish"
on_play = "http://localhost:3001/on_play"
on_stop = "http://localhost:3001/on_stop"

[authsecret]
# used for md5 authentication
key = ""
# used for simple authentication
password = ""


##########################
#    RTSP configurations  #
##########################
[rtsp]
enabled = false
port = 445
# RTP packetization MTU (bytes). Defaults to 1400 if not set.
mtu = 1400
# optional: max header read retries for server/client (default: 5)
# header_retry_max = 5
# optional: max retries during PLAY when no packet data received (default: 10)
# play_no_data_retry_max = 10
[rtsp.auth]
pull_enabled = true
push_enabled = true
# simple, md5 or none
algorithm = "simple"

##########################
#    WebRTC configurations  #
##########################
[webrtc]
enabled = false
port = 8083
[webrtc.auth]
pull_enabled = true
push_enabled = true
# simple, md5 or none
algorithm = "simple"

##########################
# HTTPFLV configurations #
##########################
[httpflv]
enabled = false
port = 8081
# optional: max retries when no media data is received (default: 10)
# max_no_data_retries = 10
[httpflv.auth]
pull_enabled = true
# simple, md5 or none
algorithm = "simple"


##########################
#    HLS configurations  #
##########################
[hls]
enabled = false
port = 8080
need_record = false
# optional: max retries when no frame data is received (default: 10)
# max_no_data_retries = 10
# optional: sleep between retries in milliseconds (default: 100)
# no_data_sleep_ms = 100
[hls.auth]
pull_enabled = true
# simple, md5 or none
algorithm = "simple"


##########################
#   LOG configurations   #
##########################
[log]
level = "info"
[log.file]
# write log to file or not（Writing logs to file or console cannot be satisfied at the same time）.
enabled = true
rotate = "hour" #[day,hour,minute]
path = "/app/logs"
